spring.application.name=destinify

# Conexão com o PostgreSQL Local
spring.datasource.url=jdbc:postgresql://localhost:5432/destinify_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Java 21 Virtual Threads
spring.threads.virtual.enabled=true

# RabbitMQ Local
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Configurações de expiração de reserva (15 minutos = 900000ms)
destinify.reservations.ttl-milliseconds=900000